configuration:
  location_entity:
    name: Locatie-entiteit
    description: Optioneel een person- of device_tracker-entiteits-ID. Laat leeg voor de Home Assistant-thuislocatie.
  poll_seconds:
    name: Verversinterval meldingen
    description: Aantal seconden tussen verzoeken aan de drie bronnen. Locatie wordt elke 15 seconden bijgewerkt.
  default_radius_km:
    name: Beginradius (km)
    description: Radius voor het eerste gebied. Bestaande gebieden pas je aan in het dashboard.
  mqtt_host:
    name: MQTT host
    description: Laat leeg voor Supervisor. Gebruik core-mosquitto voor een directe verbinding met de Mosquitto-app.
  mqtt_port:
    name: MQTT poort
    description: Brokerpoort voor de directe verbinding (meestal 1883, of 8883 met TLS).
  mqtt_username:
    name: MQTT gebruikersnaam
    description: Alleen nodig bij een direct ingesteld brokeradres.
  mqtt_password:
    name: MQTT wachtwoord
    description: Wachtwoord voor de directe brokerverbinding. Wordt niet naar het dashboard gestuurd.
  mqtt_tls:
    name: MQTT TLS
    description: Versleutelde verbinding met certificaatcontrole voor het direct ingestelde brokeradres.
